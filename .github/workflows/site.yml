name: Website
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: DrvpnTM/app
      - name: Build the website
        env:
          SITE_URL: https://drvpntm.github.io/
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
        run: |
          pip install mkdocs-material==9.8.0 mkdocs-static-i18n==1.3.1
          python3 site/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
